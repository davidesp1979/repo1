name: Build and Deploy   # Nome del workflow (apparirà nella sezione "Actions" di GitHub)

on:
  push:
    branches:
      - main            # Esegui questo workflow solo quando fai push sul branch "main"

jobs:
  build-and-push:        # Nome del job principale
    runs-on: ubuntu-latest   # Esegui il job su una macchina Ubuntu fornita da GitHub

    steps:
      # 1️⃣ Scarica il codice del repository corrente (repo A)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Login a Docker Hub per poter pushare l'immagine
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 3️⃣ Costruisci l'immagine Docker e pushala su Docker Hub
      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/myapp   # Nome completo dell'immagine (es: utente/myapp)
          TAG=$(date +%Y%m%d%H%M%S)                            # Genera un tag univoco basato su data e ora
          docker build -t $IMAGE_NAME:$TAG .                   # Costruisci l'immagine Docker locale
          docker push $IMAGE_NAME:$TAG                         # Carica (push) l'immagine su Docker Hub
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV                 # Salva il tag per gli step successivi del workflow

      # 4️⃣ Scarica il repository dei manifest (repo B)
      - name: Checkout manifest repo
        uses: actions/checkout@v3
        with:
          repository: <tuo-user>/<repo-manifest>   # 👈 sostituisci con il nome del repo B (es: mario/k8s-manifests)
          token: ${{ secrets.GH_TOKEN }}           # Token GitHub con permessi di scrittura
          path: manifests                          # Clona il repo nella cartella ./manifests

      # 5️⃣ Aggiorna il file deployment.yaml con il nuovo tag Docker
      - name: Update image tag in deployment.yaml
        run: |
          cd manifests/manifests                    # Vai nella cartella dove c'è il file deployment.yaml
          # Sostituisce la riga con "image: docker.io/<user>/myapp:<vecchio_tag>"
          # con la nuova "image: docker.io/<user>/myapp:<nuovo_tag>"
          sed -i "s|\(image: docker.io/.*/myapp:\).*|\1${IMAGE_TAG}|" deployment.yaml

          # Configura git per fare il commit automatico
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Esegui commit e push della modifica
          git add deployment.yaml
          git commit -m "Update image tag to ${IMAGE_TAG}"
          git push
