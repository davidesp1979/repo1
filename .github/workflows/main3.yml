name: Build, Push Docker Image and Update Manifests

on:
  push:
    branches:
      - master     # Il branch su cui lavori
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona il repo principale (il codice sorgente)
      - name: Checkout source repository
        uses: actions/checkout@v3

      # 2️⃣ Legge la versione dal file VERSION
      - name: Set version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 3️⃣ Login su Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # 4️⃣ Build dell'immagine Docker
      - name: Build Docker image
        run: |
          docker build -t davideparodi/repodavelearn:${{ env.VERSION }} .

      # 5️⃣ Push dell'immagine su Docker Hub
      - name: Push Docker image
        run: |
          docker push davideparodi/repodavelearn:${{ env.VERSION }}

      # 6️⃣ Clona il repository dei manifest Kubernetes
      - name: Checkout manifests repository
        uses: actions/checkout@v3
        with:
          repository: davidesp1979/repomanifest
          token: ${{ secrets.GH_PAT }}
          path: manifests
          ref: main   # Usa il branch esatto del repo manifest

      # 7️⃣ Aggiorna il tag dell’immagine nel file deployment.yaml
      - name: Update image tag in manifests
        run: |
          cd manifests
          sed -i "s|\(davideparodi/repodavelearn:\).*|\1${{ env.VERSION }}|" deployment.yaml

      # 8️⃣ Commit e push delle modifiche al repo manifest
      - name: Commit and push updated manifests
        run: |
          cd manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "Update image tag to version ${{ env.VERSION }}"
          git push origin main

