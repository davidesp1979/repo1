name: Build, Push Docker Image and Update Manifests

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3

      - name: Set version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t davideparodi/repodavelearn:${{ env.VERSION }} .

      - name: Push Docker image
        run: |
          docker push davideparodi/repodavelearn:${{ env.VERSION }}

      - name: Checkout manifests repository
        uses: actions/checkout@v3
        with:
          repository: davideparodi/manifest-repo
          token: ${{ secrets.GH_PAT }}
          path: manifests

      - name: Update image tag in manifests
        run: |
          cd manifests
          sed -i "s|\(davideparodi/repodavelearn:\).*|\1${{ env.VERSION }}|" deployment.yaml

      - name: Commit and push updated manifests
        run: |
          cd manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
